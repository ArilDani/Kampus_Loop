<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Academy Thesis Edu</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .card-register {
            background: #ffffff;
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 0.5rem;
        }

        .brand-logo .t {
            font-size: 2.2rem;
            font-weight: 800;
            color: #6366f1;
            line-height: 1;
        }

        .brand-logo .text {
            font-size: 1.7rem;
            font-weight: 700;
            color: #2563eb;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 2rem;
        }

        .input-group {
            position: relative;
            margin-bottom: 1rem;
            text-align: left;
        }

        .input-group svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: #94a3b8;
        }

        .input-group input {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 42px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.9rem;
            color: #1e293b;
        }

        .input-group input:focus {
            outline: none;
            border-color: #8b5cf6;
        }

        .btn-register {
            width: 100%;
            padding: 0.85rem;
            background: #8b5cf6;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 1rem;
            transition: background 0.2s;
        }

        .btn-register:hover {
            background: #7c3aed;
        }

        .footer-link {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #64748b;
        }

        .footer-link a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 600;
        }

        .copyright {
            margin-top: 2rem;
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .alert {
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.85rem;
        }

        .alert-warning {
            background: #fffbeb;
            color: #b45309;
        }
    </style>
</head>

<body>
    <div class="card-register">
        <div class="brand-logo">
            <span class="t">T</span>
            <span class="text">hesisedu</span>
        </div>
        <div class="subtitle">Register untuk mengakses Academy Thesis Edu</div>

        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="input-group">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <circle cx="12" cy="8" r="5" />
                    <path d="M20 21a8 8 0 0 0-16 0" />
                </svg>
                <input type="text" name="first_name" placeholder="Nama Lengkap" required>
            </div>
            <div class="input-group">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <rect width="20" height="16" x="2" y="4" rx="2" />
                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
                </svg>
                <input type="email" name="email" placeholder="Email (digunakan untuk login)" required>
            </div>
            <div class="input-group">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
                <input type="password" name="password" placeholder="Password" required>
            </div>
            <div class="input-group">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
                <input type="password" name="confirm_password" placeholder="Konfirmasi Password" required>
            </div>
            <button type="submit" class="btn-register">
                <span>Daftar Akun</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <line x1="5" y1="12" x2="19" y2="12" />
                    <polyline points="12 5 19 12 12 19" />
                </svg>
            </button>
        </form>

        <div class="footer-link">
            Sudah punya akun? <a href="{% url 'login' %}">Login di sini</a>
        </div>
        <div class="copyright">&copy; 2026 Thesis Edukasi Nusantara.</div>
    </div>
</body>

</html>
